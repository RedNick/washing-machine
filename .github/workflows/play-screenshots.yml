# Takes the Google Play phone screenshots from the demo machine on an
# emulator. Run it by hand from the Actions tab whenever the app's look
# changes. The PNGs are attached to the run as "play-screenshots", and a
# hand-started run also puts them on the "play-screenshots" pre-release so
# they download as plain images.
#
# It only runs by hand. It photographs the newest release, so on a pull
# request it would test the previous build's package id, not the branch's.
name: Play screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release to photograph (leave empty for the newest)
        required: false
        default: ''

permissions:
  contents: write # to update the "play-screenshots" pre-release

jobs:
  screenshots:
    name: Take the screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download the APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download $RELEASE_TAG --pattern '*.apk' --output app.apk
          echo "Photographing $(gh release view $RELEASE_TAG --json tagName --jq .tagName)"

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The original Pixel profile has a 1080 x 1920 screen, which fits
      # Google Play's 16:9 limit for phone screenshots.
      - name: Take the screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./scripts/play-screenshots.sh app.apk

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: play-screenshots
          path: play-screenshots/
          retention-days: 30

      # A pre-release never becomes the "latest" release, so it doesn't get
      # in the way of the APK downloads.
      - name: Put the screenshots on the play-screenshots pre-release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view play-screenshots > /dev/null 2>&1; then
            gh release create play-screenshots --prerelease \
              --title "Google Play screenshots" \
              --notes "Phone screenshots for the Play listing, taken from the demo machine by the Play screenshots workflow."
          fi
          gh release upload play-screenshots play-screenshots/[0-9]-*.png --clobber
