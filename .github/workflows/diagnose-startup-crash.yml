# Temporary: opens the published build-4 APK on an emulator to see why it
# crashes on startup. Removed once the crash is fixed.
name: Diagnose startup crash

on:
  push:
    branches: [claude/fix-startup-crash]

jobs:
  launch-published-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download build-4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download build-4 --pattern '*.apk' --output app.apk
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./scripts/launch-test.sh app.apk
      - name: Keep the log and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-test
          path: |
            launch-logcat.txt
            launch-screenshot.png
