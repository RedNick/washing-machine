# Checks the app and builds an installable Android APK.
#
# Builds from main (and builds started by hand) are published on the repo's
# Releases page as a plain .apk file you can open straight on the phone.
# Pull request builds only check that the app still builds.
#
# It is a release build (the app runs on its own, no development server),
# signed with Expo's shared debug key, so it is fine for your own phone but
# not for the Play Store.

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a build by hand from the Actions tab

# A newer push to the same branch cancels the older, now pointless, build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release that holds the APK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates the native android/ project from app.json. It isn't kept in
      # the repo, so this runs on every build.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # GitHub zips anything uploaded as a run artifact, so the APK goes on
      # a release instead, where it downloads as a plain .apk file.
      - name: Publish the APK as a release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          apk_name="washer-build-${BUILD_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"

          # Builds of other branches are marked as pre-releases, so the
          # "latest" release is always the newest build of main.
          release_kind_flag="--latest"
          if [ "$IS_MAIN" != "true" ]; then release_kind_flag="--prerelease"; fi

          gh release create "build-${BUILD_NUMBER}" "$apk_name" \
            --target "$GITHUB_SHA" \
            --title "Washer build ${BUILD_NUMBER}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open the .apk on your phone to install or update." \
            $release_kind_flag
