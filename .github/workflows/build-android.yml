# Checks the app and builds an installable Android APK.
#
# Every build is opened on an Android emulator first, and only published if
# the app starts without crashing. Builds from main (and builds started by
# hand) are then published on the repo's Releases page as a plain .apk file
# you can open straight on the phone. Pull request builds stop after the
# emulator check.
#
# It is a release build (the app runs on its own, no development server),
# signed with Expo's shared debug key, so it is fine for your own phone but
# not for the Play Store.

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a build by hand from the Actions tab

# A newer push to the same branch cancels the older, now pointless, build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      # Generates the native android/ project from app.json. It isn't kept in
      # the repo, so this runs on every build.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Google Play needs a higher version code for every upload, so each
      # build uses its run number.
      - name: Number this build
        run: sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # The bundle uploaded to Google Play, signed with your own upload key
      # from the repo's secrets. Skipped until those secrets are added.
      - name: Build the Google Play bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload key in the repo's secrets yet, so no Play bundle this time."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/upload-key.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          # These properties replace the build's debug signing for this command only.
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$keystore_path" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm "$keystore_path"

      # Hands the APK to the jobs below. Only those jobs use this copy; the
      # one people download is on the Releases page.
      - uses: actions/upload-artifact@v6
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

      - uses: actions/upload-artifact@v6
        with:
          name: aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 3
          if-no-files-found: ignore

  launch-test:
    name: Open the app on an emulator
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: apk

      # R8 renames and removes unused code; this makes sure the background
      # "wash finished" check's classes survived it.
      - name: Check the shrinker kept the background-work classes
        run: ./scripts/check-kept-classes.sh app-release.apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Catches crashes on launch (like build 4's) before anyone installs it.
      - name: Open the app and check it keeps running
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./scripts/launch-test.sh app-release.apk

      - name: Keep the device log and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: launch-test
          path: |
            launch-logcat.txt
            launch-screenshot.png
          retention-days: 7

  publish:
    name: Publish the APK
    needs: launch-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release that holds the APK
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apk
      # Only there once the upload key is in the repo's secrets.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: aab

      # GitHub zips anything downloaded from a run, so the APK goes on a
      # release instead, where it downloads as a plain .apk file.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          apk_name="h-off-build-${BUILD_NUMBER}.apk"
          cp app-release.apk "$apk_name"
          release_files=("$apk_name")

          # The Google Play bundle, when there is one. Upload it in the Play
          # Console; it can't be installed directly on a phone.
          if [ -f app-release.aab ]; then
            aab_name="h-off-build-${BUILD_NUMBER}-play.aab"
            cp app-release.aab "$aab_name"
            release_files+=("$aab_name")
          fi

          # Builds of other branches are marked as pre-releases, so the
          # "latest" release is always the newest build of main.
          release_kind_flag="--latest"
          if [ "$IS_MAIN" != "true" ]; then release_kind_flag="--prerelease"; fi

          gh release create "build-${BUILD_NUMBER}" "${release_files[@]}" \
            --target "$GITHUB_SHA" \
            --title "h.off build ${BUILD_NUMBER}" \
            --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open the .apk on your phone to install or update. The .aab (if any) is for Google Play." \
            $release_kind_flag

  # Sends each build of main to Google Play's closed test, so testers get it
  # without anyone uploading by hand. Does nothing until the Play service
  # account key is in the repo's secrets (PLAY_SERVICE_ACCOUNT_JSON).
  upload-to-play:
    name: Upload to the Google Play closed test
    needs: launch-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check the Play key is set up
        id: play-key
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No Play service account key in the repo's secrets yet, so nothing is uploaded."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the Play bundle
        if: steps.play-key.outputs.present == 'true'
        uses: actions/download-artifact@v7
        with:
          name: aab

      # "alpha" is the track the Play Console calls "Closed testing - Alpha".
      - name: Upload the bundle to the closed test
        if: steps.play-key.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.rdfn.h.off
          releaseFiles: app-release.aab
          track: alpha
          status: completed
