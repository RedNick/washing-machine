# Checks the app and builds an installable Android APK.
#
# Every build is opened on an Android emulator first, and only published if
# the app starts without crashing. The jobs pass the APK and Play bundle to
# each other through a draft release (not Actions artifacts), because the
# account's free artifact storage runs out and blocked builds 55 onwards.
#
# Builds from main (and builds started by hand) are then published on the
# repo's Releases page as a plain .apk file you can open straight on the
# phone. Pull request builds stop after the emulator check, and their draft
# release is deleted.
#
# It is a release build (the app runs on its own, no development server),
# signed with Expo's shared debug key, so it is fine for your own phone but
# not for the Play Store.

name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # lets you start a build by hand from the Actions tab

# A newer push to the same branch cancels the older, now pointless, build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the draft release that carries the build
    env:
      # Built into the app's JavaScript so the Now screen can show the build number.
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      # Where crash reports go, if you switch them on in Settings. Without it the switch stays disabled.
      EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # The deployed wash report worker, e.g. https://h-off-wash-reports.<you>.workers.dev.
      # Without it the "Wash reports" switch stays disabled.
      EXPO_PUBLIC_WASH_REPORT_URL: ${{ secrets.WASH_REPORT_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - run: npm ci

      # Generates the native android/ project from app.json. It isn't kept in
      # the repo, so this runs on every build.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Google Play needs a higher version code for every upload, so each
      # build uses its run number.
      - name: Number this build
        run: sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # The bundle uploaded to Google Play, signed with your own upload key
      # from the repo's secrets. Skipped until those secrets are added.
      - name: Build the Google Play bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload key in the repo's secrets yet, so no Play bundle this time."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/upload-key.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          # These properties replace the build's debug signing for this command only.
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$keystore_path" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm "$keystore_path"

      # Hands the APK (and Play bundle, if any) to the jobs below by putting
      # them on a draft release. Drafts are only visible to the repo's owner.
      # The publish job makes it a normal release; for pull requests the
      # clean-up job deletes it.
      - name: Put the build on a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          release_tag="build-${BUILD_NUMBER}"
          apk_name="h-off-build-${BUILD_NUMBER}.apk"
          aab_name="h-off-build-${BUILD_NUMBER}-play.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk_name"
          release_files=("$apk_name")
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "$aab_name"
            release_files+=("$aab_name")
          fi

          # A re-run of this job reuses the draft from the first attempt.
          if gh release view "$release_tag" > /dev/null 2>&1; then
            gh release upload "$release_tag" "${release_files[@]}" --clobber
          else
            gh release create "$release_tag" "${release_files[@]}" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "h.off build ${BUILD_NUMBER}" \
              --notes "Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open the .apk on your phone to install or update. The .aab (if any) is for Google Play."
          fi

  launch-test:
    name: Open the app on an emulator
    needs: build-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write # reading a draft release needs write access
    steps:
      - uses: actions/checkout@v6
      - name: Download the APK from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release download "build-${BUILD_NUMBER}" --pattern "h-off-build-${BUILD_NUMBER}.apk"
          mv "h-off-build-${BUILD_NUMBER}.apk" app-release.apk

      # R8 renames and removes unused code; this makes sure the background
      # "wash finished" check's classes survived it.
      - name: Check the shrinker kept the background-work classes
        run: ./scripts/check-kept-classes.sh app-release.apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Catches crashes on launch (like build 4's) before anyone installs it.
      - name: Open the app and check it keeps running
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./scripts/launch-test.sh app-release.apk

      # Nice to have only, so a full artifact storage allowance doesn't fail the check.
      - name: Keep the device log and screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: launch-test
          path: |
            launch-logcat.txt
            launch-screenshot.png
          retention-days: 7

  publish:
    name: Publish the APK
    needs: launch-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release that holds the APK
    steps:
      # The APK downloads from a release as a plain .apk file (anything
      # downloaded from a run is zipped), so the draft becomes a real release.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          # Builds of other branches are marked as pre-releases, so the
          # "latest" release is always the newest build of main.
          release_kind_flags=(--latest)
          if [ "$IS_MAIN" != "true" ]; then release_kind_flags=(--prerelease --latest=false); fi

          gh release edit "build-${BUILD_NUMBER}" --draft=false "${release_kind_flags[@]}"

  # Sends each build of main to Google Play's closed test, so testers get it
  # without anyone uploading by hand. Does nothing until the Play service
  # account key is in the repo's secrets (PLAY_SERVICE_ACCOUNT_JSON).
  upload-to-play:
    name: Upload to the Google Play closed test
    needs: launch-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # reading a draft release needs write access
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check the Play key is set up
        id: play-key
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "No Play service account key in the repo's secrets yet, so nothing is uploaded."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the Play bundle from the release
        if: steps.play-key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gh release download "build-${BUILD_NUMBER}" --pattern "h-off-build-${BUILD_NUMBER}-play.aab"
          mv "h-off-build-${BUILD_NUMBER}-play.aab" app-release.aab

      # "alpha" is the track the Play Console calls "Closed testing - Alpha".
      - name: Upload the bundle to the closed test
        if: steps.play-key.outputs.present == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: uk.rdfn.h.off
          releaseFiles: app-release.aab
          track: alpha
          status: completed

  # Pull request builds are never published, so their draft release is
  # deleted once the emulator check has used it.
  delete-pr-draft:
    name: Delete the pull request's draft release
    needs: [build-apk, launch-test]
    if: always() && github.event_name == 'pull_request' && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: gh release delete "build-${BUILD_NUMBER}" --yes || echo "No draft to delete."
